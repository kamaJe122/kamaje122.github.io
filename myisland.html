<!doctype html>
<!--
=====================================================================
  🏝️ 我的小島（朋友版範本）— 跟原版同一套 3D 玩具風
---------------------------------------------------------------------
  給 AI 的編輯說明（整份貼給 Claude 就能改）：
  - 3D 引擎：three.js r128 + OrbitControls（只從 cdnjs / jsdelivr 載入）
  - 所有資料存在 localStorage，key = "ai-dongzi-island-3d-v1"
      S = { islandName, owner:{name, look}, isles:[{id,slot,name,note,theme}],
            people:[{id,name,task,status,isle,look,quests:[{id,text,done}]}],
            xp, lastDay, guideDone, ui:{names,paused,bird,timeMode,hour} }
  - pets = [{id,kind(cat|dog|parrot=小鳥),name,isle,color,belly,pattern(COAT/BIRD_PAT),accent,collar,
             breed(mutt|shiba|chow),longHair,ears(prick|drop),pats}]（島嶼小動物）
  - items = [{id,type(ITEMS),x,z,y(高度),ry(方向弧度),s(大小),c:{顏色}}]（擺設模式放的家具）
  - 小島地板：isles[].floor / S.hubFloor（#hex，沒設定就用主題色）
  - 發布新版：把下面的 APP_VERSION、APP_NOTES 和網站根目錄的 version.json 一起改成新版本號
  - look = { skin, hair, style(STYLES), kid, outfit(OUTFITS), shirt, pants, oc, oc2, capC, clipC,
             accs:[ACCS 的 key…], ac:{配件key:顏色} }（所有顏色都是 #hex，可用調色盤自由調）
  - 小島位置：SLOTS（中央主島 + 12 個六角形位置）；顏色主題：THEMES
  - 島民狀態：STATUS（進行中＝快步走、待辦＝邊走邊舉手、穩定運作＝散步、暫停、閒置＝打瞌睡）；點島民再點地板，他會走過去（p.home 記住位置）
  - 換日時：已完成任務自動清掉，未完成的自動留到隔天
=====================================================================
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我的小島</title>
<link rel="manifest" href="myisland.webmanifest">
<meta name="theme-color" content="#e8673a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的小島">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/island-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --orange:#e8673a; --orange-deep:#c94f25; --ink:#2a2421; --ink-soft:#6b5f58; --paper:#fbf6ef; --panel:#fffdf9; --line:#eadfd3;
  --font-display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#bfe3ef;color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.badge{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--c);display:grid;place-items:center;box-shadow:0 2px 6px #0002;pointer-events:auto;cursor:pointer;margin:-15px 0 0 -15px;position:relative}
.badge svg{width:15px;height:15px;stroke:var(--c);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.badge .q{position:absolute;top:-7px;right:-8px;width:17px;height:17px;border-radius:50%;background:#f2b705;color:#2a2421;font:900 11px/13px var(--font-display);text-align:center;border:2px solid #fff;box-sizing:border-box}
.badge .q.ok{background:#2f9e5f;color:#fff}
.tag{background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;padding:3px 11px 3px 6px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px #0003;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%)}
.tag i{width:16px;height:16px;border-radius:50%;background:var(--orange);display:inline-block;border:2px solid #fff}
.tag.me{background:#fff;color:var(--ink);padding-left:11px}
.tag.me b{color:var(--orange)}
.tag.sel{outline:2px solid var(--orange)}
.tag.pet{background:#e8a25a;font-size:12px;padding:2px 10px}
.tag.pet.sel{outline:2px solid #fff}
.zpill{background:#fffdf9;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;box-shadow:0 2px 8px #0002;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.zpill b{color:var(--orange);font-size:11px;margin-right:5px}
.zpill,.badge,.tag{transition:font-size .25s,padding .25s,transform .25s,opacity .25s}
#labels[data-zoom=far] .badge,#labels[data-zoom=far] .tag:not(.me){display:none}
#labels[data-zoom=far] .tag.me{transform:translate(-50%,-100%) scale(.62);transform-origin:50% 100%;opacity:.9}
#labels[data-zoom=far] .zpill{font-size:10px;padding:1px 7px;background:#fffdf9a8;box-shadow:none;font-weight:600}
#labels[data-zoom=mid] .tag:not(.me):not(.sel){display:none}
#labels[data-zoom=mid] .badge{transform:scale(.62);opacity:.92}
#labels[data-zoom=mid] .zpill{font-size:11px;padding:2px 9px;background:#fffdf9d0}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));background:var(--paper);border-radius:22px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px #0002;cursor:pointer;max-width:calc(100% - 110px);border:none;font:inherit;text-align:left;color:var(--ink)}
.brand .big{font-family:var(--font-display);font-weight:900;color:var(--orange);font-size:22px;line-height:1;letter-spacing:.02em;max-width:5.2em;word-break:break-all}
.brand .sub{font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.35;min-width:0}
.brand .sub span{color:var(--orange);font-size:11px;letter-spacing:.08em}
.brand .lv{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums}
.rail{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.rbtn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:13px;background:#fffdf9ee;color:var(--ink);border:1px solid var(--line);border-radius:14px;width:62px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 2px 8px #0001;position:relative}
.rbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbtn.add{background:var(--orange);color:#fff;border-color:var(--orange-deep);box-shadow:0 3px 0 var(--orange-deep)}
.rbtn.add[aria-pressed=true]{background:var(--orange-deep)}
.rbtn.add.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--orange-deep),0 0 0 7px #e8673a44}}
@media (prefers-reduced-motion:reduce){.rbtn.add.pulse{animation:none}}
.rgap{height:4px}
.cnt{position:absolute;top:-6px;right:-6px;background:#f2b705;color:#2a2421;border-radius:999px;min-width:20px;height:20px;font-size:11px;line-height:16px;padding:0 4px;border:2px solid #fff;box-sizing:border-box;font-variant-numeric:tabular-nums}
.chips{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.chip{font:inherit;font-family:var(--font-display);font-weight:700;font-size:13px;background:#fffdf9ee;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbtn:focus-visible,.chip:focus-visible,.sheet button:focus-visible,.brand:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #0003;max-height:62%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:84%;max-height:84%}
.sheet-in{max-width:620px;width:100%;margin-inline:auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 8px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:18px;display:flex;align-items:center;gap:8px;min-width:0}
.x{font:inherit;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);flex:none}
.sheet-body{overflow:auto;padding:0 18px 18px;min-height:0;flex:1 1 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tab{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.meta{font-size:13px;color:var(--ink-soft)}
.go{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;padding:13px;border-radius:16px;background:var(--orange);color:#fff;border:none;width:100%;font-family:var(--font-display);font-weight:900;font-size:16px;cursor:pointer}
.go.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grp{margin:14px 0 6px;font-family:var(--font-display);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.row .nm{font-weight:700;font-size:14px}
.row .ds{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .ag{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.seen{font-size:11px;color:#b88a00;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.btn.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.red{color:#c2412d;border-color:#f1c4b8}
.btn.redfill{background:#d9473a;color:#fff;border-color:#d9473a}
.say{background:#fff3e2;border:1px solid #f1d9bb;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:15px;margin:10px 0;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);margin-top:10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:10px;background:#fff6f3;border:1px solid #f1c4b8;border-radius:12px;padding:10px}
.confirm span{flex:1 1 160px}
.li{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.li span{flex:1;min-width:0;word-break:break-word}
.li.done span{text-decoration:line-through;color:var(--ink-soft)}
.li input[type=checkbox]{width:20px;height:20px;accent-color:var(--orange);flex:none}
.li .who{font-size:11px;font-weight:700;color:var(--orange);flex:none}
.del{font:inherit;border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.addrow{display:flex;gap:6px;margin:4px 0 8px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.bar{height:10px;background:#f1e6da;border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--orange);transition:width .4s}
.fld{margin:0 0 12px}
.fld>label{display:block;font-weight:700;font-size:13px;margin-bottom:5px;font-family:var(--font-display)}
.fld input[type=text],.fld select,.fld textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;color:var(--ink)}
.fld textarea{min-height:62px;resize:vertical}
.hint{font-size:12px;color:var(--ink-soft);margin-top:4px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--orange)}
.theme{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:var(--ink)}
.theme i{width:22px;height:22px;border-radius:50%;display:inline-block}
.theme[aria-pressed=true]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.timebig{font-family:var(--font-display);font-weight:900;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
input[type=range]{width:100%;accent-color:var(--orange)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft)}
textarea.code{width:100%;height:120px;margin:6px 0;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}

/* 長相編輯器 */
.editor{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.pv{width:150px;height:180px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#ffffff,#d7eef5);overflow:hidden;position:relative}
.editor>.pv{position:sticky;top:6px;z-index:2;align-self:start;box-shadow:0 6px 16px #0002}
.pv canvas{display:block;width:100%!important;height:100%!important}
.pv small{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--ink-soft)}
.opt-row{margin-bottom:8px}
.opt-row .ol{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{font:inherit;font-size:12.5px;font-weight:700;min-width:30px;height:30px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:0 9px;cursor:pointer;color:var(--ink)}
.opt.c{width:30px;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.opt[aria-pressed=true]{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.opt.c[aria-pressed=true]{box-shadow:0 0 0 3px var(--orange)}
@media (max-width:520px){.editor{grid-template-columns:1fr}.pv{width:150px;height:170px;margin:0 auto}}

/* 調色盤 */
.opt.pal{position:relative;background:conic-gradient(#ff5a5a,#ffd84d,#6fdc6f,#4fd1e0,#5b7fe0,#c56fe0,#ff5a5a)!important}
.opt.pal::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cur,#fff);box-shadow:0 0 0 2px #fff}
.cpp{margin:8px 0 4px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px #0001}
.cph{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cpi{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
.cph code{font-size:12px;color:var(--ink-soft);flex:1}
.cps{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-soft);margin:9px 0}
.cps input{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:999px;margin:0;border:1px solid #0002;background:#ddd}
.cps input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px #0004;cursor:pointer}
.cps input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
/* 右側功能列：永遠在最上層、不跟著頁面縮放，放不下時可以上下滑 */
html,body,#app{touch-action:none;overscroll-behavior:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#hud .chips{pointer-events:none}#hud .chips>*{pointer-events:auto}
.sheet,.guide{z-index:7}.setup{z-index:8}
.sheet-body,.setup,.scard,.rail{touch-action:pan-y}
.rail{z-index:6;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:2px 2px 6px;margin:-2px -2px 0 0}
.rail::-webkit-scrollbar{display:none}
.rail .rbtn{flex:none}
@media (max-height:760px){.rail{gap:6px}.rbtn{height:48px;width:58px;font-size:12px}.rbtn svg{width:15px;height:15px}}
.bkcard{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:13px;color:var(--ink-soft)}
.bkcard b{color:var(--ink);font-size:14.5px}
.bkcard.ok{border:2px solid #3fa66a;background:#f1faf4}.bkcard.bad{border:2px solid #e5534b;background:#fdf1f0}
.bkbtns{display:flex;flex-direction:column;gap:0}.bkbtns .go{margin-top:8px}
.sblk{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;margin:0 0 8px}.sblk .trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sblk input[type=time]{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fffdf9;color:var(--ink)}
.ssel{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fffdf9;color:var(--ink);margin-top:8px}
.tag .act{margin-left:2px}
.chip.warn{background:#e8673a;color:#fff;border-color:#c94f25}
.pickbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);left:12px;right:86px;margin:0 auto;max-width:460px;display:flex;align-items:center;gap:8px;background:#e8673a;color:#fff;border-radius:16px;padding:8px 8px 8px 14px;z-index:8;font-weight:700;box-shadow:0 6px 20px #0004}.pickbar span{flex:1}
.steps2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;margin:0 0 8px}.steps2 ol{margin:6px 0 4px;padding-left:20px}.steps2 li{margin:3px 0}
.warn2{background:#fff4d6;border:1.5px solid #f2b705;border-radius:12px;padding:8px 10px;font-size:12.5px;margin:0 0 8px}
/* 擺設：選取框與鎖頭 */
.selbox{position:absolute;left:0;top:0;border:2.5px dashed var(--orange);border-radius:12px;pointer-events:none;z-index:4;box-shadow:0 0 0 2px #fff8}
.selbox.fx .lockbtn{left:auto;right:calc(100% + 6px)}.selbox.fy .lockbtn{top:auto;bottom:calc(100% + 6px)}
.selbox.locked{border:3px solid #8f847c;border-style:solid;box-shadow:0 0 0 3px #f2b70555,0 0 18px #f2b70599}
.lockbtn{position:absolute;left:calc(100% + 6px);top:calc(100% + 6px);width:44px;height:44px;border-radius:50%;border:2.5px solid var(--orange);background:#fff;font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:0 3px 10px #0003;padding:0}
.selbox.locked .lockbtn{border-color:#6b5f58;background:#e9e4da}

function makeHeld(key,col){const g=new THREE.Group();
  if(key.startsWith('it:')){const t=key.slice(3);if(!ITEMS[t]||!BUILD[t])return null;const o=makeItem({type:t,c:{}}),b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());const k=0.3/Math.max(sz.x,sz.y,sz.z,0.01);o.scale.setScalar(k);o.position.set(-(b.min.x+b.max.x)/2*k,-b.min.y*k-0.02,-(b.min.z+b.max.z)/2*k+0.06);g.add(o)}
  else{const H=HOLD[key];if(!H)return null;H[3](g,col||H[2]);const sz=new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3());if(Math.max(sz.x,sz.y,sz.z)<0.5)g.scale.setScalar(1.4)}
  g.traverse(m=>{if(m.isMesh){m.castShadow=true}});return g}
function holdName(key){if(!key)return '';if(key.startsWith('it:')){const D=ITEMS[key.slice(3)];return D?D.n:''}return HOLD[key]?HOLD[key][1]:''}
function holdOptions(cur){let o='<option value="">（空手）</option>';HOLD_GRP.forEach(([g,l])=>{o+='<optgroup label="'+l+'">';for(const k in HOLD)if(HOLD[k][0]===g)o+='<option value="'+k+'"'+(cur===k?' selected':'')+'>'+HOLD[k][1]+'</option>';o+='</optgroup>'});
  o+='<optgroup label="🧺 擺設裡的小東西">';for(const t in ITEMS)if(ITEMS[t].small)o+='<option value="it:'+t+'"'+(cur==='it:'+t?' selected':'')+'>'+ITEMS[t].e+' '+ITEMS[t].n+'</option>';return o+'</optgroup>'}

function rangeRect(pl,range){if(range==='isle')return isleArea(isleAt(pl.x,pl.z)||'hub');const r=range==='wide'?5:range==='near'?2:0.3;return {x0:pl.x-r,x1:pl.x+r,z0:pl.z-r,z1:pl.z+r}}

function hm(s){const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])+(+m[2])/60:0}
function schedNow(p){if(!Array.isArray(p.sched))return null;const h=simHour;for(const b of p.sched){const f=hm(b.from),t=hm(b.to);if(f===t)continue;if(f<t?(h>=f&&h<t):(h>=f||h<t))return b}return null}
function isleArea(id){if(id==='hub'||!isleById(id))return {x0:-6.5,x1:6.5,z0:1.6,z1:7.2};const c=isleCenter(id);return {x0:c.x-6.5,x1:c.x+6.5,z0:c.z-2.5,z1:c.z+7}}
function placePoint(p,place){place=place||'home';
  if(place.startsWith('pt:')){const q=place.slice(3).split(',').map(Number);if(isFinite(q[0])&&isFinite(q[1]))return {x:q[0],z:q[1],face:null}}
  if(place.startsWith('item:')){const it=S.items.find(x=>x.id===place.slice(5));if(it){const k=it.s||1,ry=it.ry||0,o=itemObjs[it.id],fp=o&&o.userData.fp;
    if(fp){const lx=fp.cx*k,lz=(fp.cz+fp.hz)*k+BODY+0.15;return {x:it.x+lx*Math.cos(ry)+lz*Math.sin(ry),z:it.z-lx*Math.sin(ry)+lz*Math.cos(ry),face:ry+Math.PI}}
    const d=(['bed','sofa','balcony','island','counter','register','house'].includes(it.type)?1.5:1.0)*k;return {x:it.x+Math.sin(ry)*d,z:it.z+Math.cos(ry)*d,face:ry+Math.PI}}}
  if(place.startsWith('isle:')){const r=isleArea(place.slice(5));return {x:(r.x0+r.x1)/2+(Math.random()-0.5)*4,z:(r.z0+r.z1)/2+(Math.random()-0.5)*2,face:null}}
  const r=homeRect(p);return {x:(r.x0+r.x1)/2,z:(r.z0+r.z1)/2,face:null}}
function placeLabel(place){if(!place||place==='home')return '自己的位置';if(place.startsWith('pt:')){const q=place.slice(3).split(',').map(Number),k=isleAt(q[0],q[1]);return '地圖上點的位置（'+(k?isleName(k):'海上')+'）'}if(place.startsWith('isle:'))return isleName(place.slice(5));if(place.startsWith('item:')){const it=S.items.find(x=>x.id===place.slice(5));return it&&ITEMS[it.type]?ITEMS[it.type].n+'（'+itemIsleName(it)+'）':'（物件不見了）'}return ''}

function actGroups(c,name){c.acts=c.acts||{};if(c.acts[name])return c.acts[name];const A=ACTIONS[name],P={};

  if(b.type==='stay'){const r=rangeRect(pl,rg);v.sched={type:'stay',rect:r};v.rect=r;goTo(v,pl.x,pl.z);return}

  v.sched={type:'work',ax:pl.x,az:pl.z,face:pl.face,tasks:tasks.length?tasks:['talk'],ti:-1,until:0,rr:rg==='spot'?null:rangeRect(pl,rg)};goTo(v,pl.x,pl.z)}
function homeTick(v,dt){const w=v.sched,c=v.c,P=S.ui.paused;if(!w||w.type!=='home'||v.path)return false;if(v.inside)return true;

function visitNext(v){const here=isleAt(v.x,v.zz)||'hub',ids=['hub'].concat(S.isles.map(i=>i.id)).filter(k=>k!==here);if(!ids.length)return;const k=pick(ids),r=isleArea(k);

function workTick(v,dt){const w=v.sched,c=v.c,P=S.ui.paused;if(!w||w.type!=='work'||v.path)return false;
  if(w.ti<0||v.t>=w.until){if(w.rr&&w.ti>=0){const k0=isleAt(w.ax,w.az);for(let i=0;i<8;i++){const x=w.rr.x0+Math.random()*(w.rr.x1-w.rr.x0),z=w.rr.z0+Math.random()*(w.rr.z1-w.rr.z0);if(isleAt(x,z)===k0){w.ax=x;w.az=z;w.face=null;break}}}w.ti=(w.ti+1)%w.tasks.length;w.cur=w.tasks[w.ti];w.until=v.t+9+Math.random()*7;w.t0=v.t;w.leg=0;w.bx=null;showAct(v,w.cur)}
  const A=ACTIONS[w.cur],G=actGroups(c,w.cur);resetPose(c);c.g.rotation.order='XYZ';c.g.rotation.x=0;let walking=false;
  if(A.walk){if(w.bx==null){let tries=0;do{const a=Math.random()*Math.PI*2;w.bx=w.ax+Math.cos(a)*2.6;w.bz=w.az+Math.sin(a)*2.6;tries++}while(tries<8&&isleAt(w.bx,w.bz)!==isleAt(w.ax,w.az));if(isleAt(w.bx,w.bz)!==isleAt(w.ax,w.az)){w.bx=w.ax;w.bz=w.az}}
    const tx=w.leg?w.bx:w.ax,tz=w.leg?w.bz:w.az,dx=tx-v.x,dz=tz-v.zz,d=Math.hypot(dx,dz);
    if(d<0.15){w.leg=1-w.leg}else if(!P){const a=step2(v,'x','zz',tx,tz,1.3*dt,null);if(a!=null)v.face=a;walking=true}}
  else{const dx=w.ax-v.x,dz=w.az-v.zz,d=Math.hypot(dx,dz);if(d>0.12&&!P){const a=step2(v,'x','zz',w.ax,w.az,1.5*dt,null);if(a!=null)v.face=a;walking=true}else if(w.face!=null)v.face=w.face}
  let dr=v.face-c.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));c.g.rotation.y+=dr*Math.min(1,dt*8);
  const r=A.pose(c,P?0:v.t-w.t0,G)||{};
  if(walking){const sw=P?0:Math.sin(v.t*9)*0.5;c.legL.rotation.x=sw;c.legR.rotation.x=-sw}
  c.g.position.set(v.x,TOP+0.17+bridgeY(v.x,v.zz)+(r.y||0)+(walking&&!P?Math.abs(Math.sin(v.t*9))*0.06:0),v.zz);return true}
function nowText(p){const b=schedNow(p),v=byId[p.id];if(!b)return p.freeMode==='visit'?'自由活動：到處串門子':'自由活動：在本島散步';const span='（'+b.from+'～'+b.to+'）',rn=k=>(RANGES.find(r=>r[0]===k)||['',''])[1].replace(/（.*）/,'');
  if(b.type==='home')return (v&&v.inside?'🏠 在家休息':'🏠 回家中・'+houseLabel(p))+span;
  if(b.type==='work'){const cur=v&&v.sched&&v.sched.cur;return '🛠️ 工作中'+(cur?'・'+ACTIONS[cur].e+' '+ACTIONS[cur].n:'')+'・'+placeLabel(b.place)+'（'+rn(b.range||'spot')+'）'+span}
  if(b.type==='stay')return '📍 待在 '+placeLabel(b.place)+'（'+rn(b.range||'near')+'）'+span;
  return '🚶 '+(b.scope==='visit'?'到處串門子':b.scope==='place'?'在'+placeLabel(b.place)+'附近散步':'在'+(b.scope&&b.scope!=='isle'?isleName(b.scope):'本島')+'散步')+span}

/* 坐沙發、坐長椅、躺床：spot 是家具上的位置（家具自己的座標，臉朝 +z） */
const REST={sofa:[{x:-0.48,z:0.1,y:0.6,k:'sit'},{x:0.48,z:0.1,y:0.6,k:'sit'}],bench:[{x:-0.5,z:0.02,y:0.61,k:'sit'},{x:0.5,z:0.02,y:0.61,k:'sit'}],bed:[{x:-0.46,z:0.95,y:0.6,k:'lie'},{x:0.46,z:0.95,y:0.6,k:'lie'}],bamboochair:[{x:0,z:0.02,y:0.56,k:'sit'}],sofachair:[{x:0,z:0.08,y:0.55,k:'sit'}],highchair:[{x:0,z:0,y:0.84,k:'sit'}],hornchair:[{x:0,z:0.03,y:0.58,k:'sit'}]};
function restWorld(it,sp){const k=it.s||1,c=Math.cos(it.ry||0),n=Math.sin(it.ry||0),lx=sp.x*k,lz=sp.z*k;return {x:it.x+lx*c+lz*n,z:it.z-lx*n+lz*c,y:(it.y||0)+sp.y*k,ry:it.ry||0}}
function restTaken(id,i,me){return chars.some(o=>o!==me&&o.R&&o.R.id===id&&o.R.i===i)}
function findRest(v,kind){const types=kind==='lie'?['bed']:['sofa','bench','sofachair','bamboochair','hornchair'],out=[];
  S.items.forEach(it=>{if(!types.includes(it.type))return;if((isleAt(it.x,it.z)||'hub')!==v.p.isle)return;REST[it.type].forEach((sp,i)=>{if(!restTaken(it.id,i,v))out.push({it,i,d:Math.hypot(it.x-v.x,it.z-v.zz)+(it.type==='bench'?1000:0)})})});
  return out.sort((a,b)=>a.d-b.d)}
function standUp(v){const c=v.c;c.g.rotation.order='XYZ';const ry=c.g.rotation.y;c.g.rotation.set(0,ry,0);c.legL.rotation.x=c.legR.rotation.x=0;c.armL.rotation.set(0,0,0);c.armR.rotation.set(0,0,0);c.head.rotation.set(0,0,0);
  if(v.p.status!=='閒置')c.eyes.forEach(e=>e.scale.set(1,1,1));else{c.eyes.forEach(e=>e.scale.set(1.3,0.22,1));c.head.rotation.z=0.28}
  if(v.R&&v.arrived){v.x=c.g.position.x+Math.sin(ry)*0.9;v.zz=c.g.position.z+Math.cos(ry)*0.9}v.tx=v.x;v.tz=v.zz;v.R=null;v.arrived=false;v.wait=1.5;v.face=ry}
function restPose(v,w,k){const c=v.c,sc=c.g.scale.y;c.g.rotation.order='YXZ';
  if(k==='lie'){c.g.rotation.set(-Math.PI/2,w.ry,0);c.g.position.set(w.x,TOP+w.y+0.42*sc,w.z);c.legL.rotation.x=c.legR.rotation.x=0;c.armL.rotation.set(0,0,0.12);c.armR.rotation.set(0,0,-0.12);c.head.rotation.set(0,0,0);c.eyes.forEach(e=>e.scale.set(1.3,0.22,1))}
  else{c.g.rotation.set(0,w.ry,0);c.g.position.set(w.x,TOP+w.y-0.42*sc,w.z);c.legL.rotation.x=c.legR.rotation.x=-1.45;c.armL.rotation.set(-0.35,0,0);c.armR.rotation.set(-0.35,0,0)}}
function sendRest(pid,kind){const v=byId[pid],p=S.people.find(x=>x.id===pid);if(!v||!p)return false;if(kind!=='up')unpause();if(v.inside){v.inside=false;v.c.g.visible=true}
  if(kind==='up'){p.rest=null;save();if(v.R)standUp(v);return true}
  const c=findRest(v,kind);if(!c.length){toast(kind==='lie'?'🛏️ 這座島上還沒有空的床，先按「擺設」放一張吧':'🛋️ 這座島上還沒有空的沙發或長椅，先按「擺設」放一張吧');return false}
  if(v.R)standUp(v);p.rest={id:c[0].it.id,i:c[0].i};save();v.R={id:p.rest.id,i:p.rest.i,auto:false};v.arrived=false;
  toast(kind==='lie'?'💤 '+p.name+' 去床上躺一下':'🛋️ '+p.name+' 去坐一下');return true}
function tryAutoRest(v){if(v.R||v.seat||(v.sched&&v.sched.type==='work')||!['穩定運作','暫停','閒置'].includes(v.p.status))return;const kind=v.p.status==='閒置'&&Math.random()<0.7?'lie':'sit';
  const c=findRest(v,kind);if(!c.length)return;const pick=c[Math.floor(Math.random()*Math.min(3,c.length))];v.R={id:pick.it.id,i:pick.i,auto:true,until:v.t+10+Math.random()*16};v.arrived=false}
function animRest(v,dt){const c=v.c,P=S.ui.paused,it=S.items.find(x=>x.id===v.R.id),sp=it&&REST[it.type]&&REST[it.type][v.R.i];
  if(!sp){if(!v.R.auto){v.p.rest=null;save()}standUp(v);return false}
  const w=restWorld(it,sp);
  if(!v.arrived){const dx=w.x-v.x,dz=w.z-v.zz,d=Math.hypot(dx,dz);
    if(d<0.15||(v._stuck&&d<2.2)){v.arrived=true}else{if(!P){const a=step2(v,'x','zz',w.x,w.z,1.8*dt,v.R.id);if(a!=null)v.face=a}
      c.g.rotation.order='XYZ';c.g.rotation.x=0;c.g.position.set(v.x,TOP+0.17+(P?0:Math.abs(Math.sin(v.t*9))*0.08),v.zz);let dr=v.face-c.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));c.g.rotation.y+=dr*Math.min(1,dt*8);
      const sw=P?0:Math.sin(v.t*9)*0.6;c.legL.rotation.x=sw;c.legR.rotation.x=-sw;c.armL.rotation.set(-sw*0.8,0,0);c.armR.rotation.set(sw*0.8,0,0);c.cup.visible=false;return true}}
  restPose(v,w,sp.k);if(!P&&sp.k==='sit')c.head.rotation.y=Math.sin(v.t*0.6)*0.25;
  if(v.R.auto&&v.t>v.R.until)standUp(v);return true}
function animChar(v,dt){const c=v.c,P=S.ui.paused;v.t+=dt;
  v.schT=(v.schT||0)-dt;if(v.schT<=0){v.schT=1;const b=schedNow(v.p),k=b?[b.id,b.from,b.to,b.type,b.place,b.scope,(b.tasks||[]).join()].join('|'):'';if(k!==v.schK){v.schK=k;applyBlock(v,b)}}
  if(v.R&&animRest(v,dt))return;
  moodTick(v,dt);if(socialTick(v,dt))return;
  if(v.path&&v.path.length){let wp=v.path[0];if(v.path.length>1&&Math.hypot(wp.x-v.x,wp.z-v.zz)<0.15){v.path.shift();wp=v.path[0]}
    const dx=wp.x-v.x,dz=wp.z-v.zz,d=Math.hypot(dx,dz);
    if(d<0.15&&v.path.length<=1){v.path=null;v.rect=(v.sched&&v.sched.rect)||homeRect(v.p);v.tx=v.x;v.tz=v.zz;v.wait=2.5}
    else{if(!P){const a=step2(v,'x','zz',wp.x,wp.z,2.4*dt,null);if(a!=null)v.face=a;else if(v._stuck){v.path=null;v.tx=v.x;v.tz=v.zz;v.wait=1.5}}
      c.g.position.set(v.x,TOP+0.17+bridgeY(v.x,v.zz)+(P?0:Math.abs(Math.sin(v.t*10))*0.08),v.zz);let dr=v.face-c.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));c.g.rotation.y+=dr*Math.min(1,dt*10);
      const sw=P?0:Math.sin(v.t*10)*0.6;c.legL.rotation.x=sw;c.legR.rotation.x=-sw;c.armL.rotation.x=-sw*0.8;if(v.p.status==='待辦'){if(!P)c.armR.rotation.z=2.65+Math.sin(v.t*5)*0.25}else c.armR.rotation.x=sw*0.8;c.cup.visible=false;return}}
  if(homeTick(v,dt))return;
  if(workTick(v,dt))return;
  if(v.seat){c.g.position.set(v.x,TOP+0.32,v.zz);c.g.rotation.y=0;c.legL.rotation.x=c.legR.rotation.x=-1.45;
    if(!P){const ty=Math.sin(v.t*13);c.armL.rotation.set(-0.85+ty*0.08,0,0);c.head.rotation.x=0.12;
      if(v.p.status==='待辦')c.armR.rotation.set(0,0,2.65+Math.sin(v.t*5)*0.25);else c.armR.rotation.set(-0.85-ty*0.08,0,0)}return}
  if(!P&&v.speed){
    if(v.wait>0)v.wait-=dt;
    else{const dx=v.tx-v.x,dz=v.tz-v.zz,d=Math.hypot(dx,dz);
      if(d<0.2){v.wait=1.5+Math.random()*3;{const q=pickFree(v.rect);v.tx=q.x;v.tz=q.z}if(v.sched&&v.sched.visit&&Math.random()<0.35)visitNext(v);else if(Math.random()<0.18)tryAutoRest(v)}
      else{const a=step2(v,'x','zz',v.tx,v.tz,v.speed*dt,null);if(a!=null)v.face=a;else if(!v._ghost){v.tx=v.x;v.tz=v.zz}}}}
  const walking=!P&&v.speed&&v.wait<=0;
  c.g.position.x=v.x;c.g.position.z=v.zz;let dr=v.face-c.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));c.g.rotation.y+=dr*Math.min(1,dt*8);
  const sw=walking?Math.sin(v.t*9)*0.6:0;c.legL.rotation.x=sw;c.legR.rotation.x=-sw;c.armL.rotation.x=-sw*0.8;
  if(v.p.status==='待辦'){if(!P)c.armR.rotation.z=2.65+Math.sin(v.t*5)*0.25}else c.armR.rotation.x=sw*0.8;
  c.g.position.y=TOP+0.17+(walking?Math.abs(Math.sin(v.t*9))*0.08:(!P?Math.sin(v.t*1.8)*0.015:0));
  if(v.p.status==='閒置'&&!P)c.head.rotation.z=0.28+Math.sin(v.t*0.9)*0.06;
  /* 小動作：喝咖啡、伸懶腰、東張西望、打瞌睡 */
  if(walking||P){if(v.act&&walking){v.act=null;c.cup.visible=false;c.armL.rotation.z=0;if(v.p.status!=='待辦')c.armR.rotation.z=0;c.head.rotation.set(0,0,v.p.status==='閒置'?0.28:0)}return}
  v.actT=(v.actT||0)+dt;
  if(!v.act){v.gap=(v.gap==null?Math.random()*4:v.gap)-dt;if(v.gap<=0){v.act=pick(ACTS[v.p.status]||['look']);v.actT=0;v.actD=3+Math.random()*4;c.cup.visible=v.act==='coffee';v.gap=2+Math.random()*6}return}
  if(v.actT>v.actD){v.act=null;c.cup.visible=false;c.armL.rotation.z=0;if(v.p.status!=='待辦')c.armR.rotation.z=0;c.head.rotation.x=0;c.head.rotation.y=0;return}
  const k=Math.max(0,Math.min(1,v.actT/0.5,(v.actD-v.actT)/0.5));
  if(v.act==='coffee'){const s=Math.max(0,Math.sin(v.actT*1.4));c.armR.rotation.x=-(1.2+1.0*s)*k;c.head.rotation.x=-0.15*s*k}
  else if(v.act==='stretch'){c.armL.rotation.z=-2.7*k;if(v.p.status!=='待辦')c.armR.rotation.z=2.7*k;c.head.rotation.x=-0.25*k}
  else if(v.act==='look')c.head.rotation.y=Math.sin(v.actT*0.9)*0.7*k;
  else if(v.act==='nap')c.head.rotation.x=0.4*k}

/* 小動物：散步、搖尾巴、鸚鵡會飛 */
let pets=[],petById={};
function petRect(id){const c=isleCenter(id);if(id==='hub'||!isleById(id))return {x0:-7,x1:7,z0:0.6,z1:8};return {x0:c.x-7,x1:c.x+7,z0:c.z-1.5,z1:c.z+7.5}}
function spawnPets(){pets.forEach(v=>v.tagWrap.remove());pets=[];petById={};
  S.pets.forEach(p=>{if(p.isle!=='hub'&&!isleById(p.isle))p.isle='hub';const m=makePet(p),r=petRect(p.isle);
    const x=r.x0+Math.random()*(r.x1-r.x0),z=r.z0+Math.random()*(r.z1-r.z0);m.g.position.set(x,TOP+0.17,z);world.add(m.g);m.hit.userData.pet=p.id;
    const v={p,m,kind:p.kind,rect:r,x,z,tx:x,tz:z,wait:Math.random()*3,t:Math.random()*9,face:Math.random()*6,fy:0,jump:0};
    v.tagWrap=div('lbl','');v.tag=div('tag pet',PET_KIND[p.kind].emoji+' '+esc(p.name),v.tagWrap);v.tag.addEventListener('click',()=>selectPet(p.id));
    pets.push(v);petById[p.id]=v})}
function pickPetTarget(v){const r=v.rect,q=pickFree(r);v.tx=q.x;v.tz=q.z;
  if(me&&Math.random()<0.25&&isleAt(meState.x,meState.z)===v.p.isle){v.tx=meState.x+0.9;v.tz=meState.z+0.7}
  v.fly=v.kind==='parrot'&&Math.random()<0.4}
function animPet(v,dt){const m=v.m,P=S.ui.paused;v.t+=dt;
  if(!P){if(v.wait>0)v.wait-=dt;
    else{const dx=v.tx-v.x,dz=v.tz-v.z,d=Math.hypot(dx,dz);
      if(d<0.15){v.wait=({cat:3,turtle:5,snake:4,cow:5}[v.kind]||1.5)+Math.random()*4;v.fly=false;pickPetTarget(v)}
      else{const sp=v.fly?2.6:({dog:1.4,cat:0.9,pig:0.8,snake:0.5,hamster:1.0,turtle:0.22,cow:0.6}[v.kind]||0.55);if(v.fly){const s=Math.min(d,sp*dt);v.x+=dx/d*s;v.z+=dz/d*s;v.face=Math.atan2(dx,dz)}else{const a=step2(v,'x','z',v.tx,v.tz,sp*dt,null);if(a!=null)v.face=a;else if(!v._ghost){v.tx=v.x;v.tz=v.z}}}}}
  const walking=!P&&v.wait<=0;v.jump=Math.max(0,v.jump-dt*1.8);
  let y=TOP+0.17+bridgeY(v.x,v.z);
  if(v.kind==='parrot'){v.fy=v.fly&&!P?Math.min(2.2,v.fy+dt*3):Math.max(0,v.fy-dt*3);y+=v.fy+(walking&&!v.fly?Math.abs(Math.sin(v.t*10))*0.12:0)}
  else if(v.kind!=='snake'&&v.kind!=='turtle')y+=walking?Math.abs(Math.sin(v.t*(v.kind==='dog'?11:v.kind==='hamster'?16:9)))*0.04:0;
  y+=Math.sin(Math.min(1,v.jump)*Math.PI)*0.8;m.g.position.set(v.x,y,v.z);
  let dr=v.face-m.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));m.g.rotation.y+=dr*Math.min(1,dt*7);
  const sw=walking&&!v.fly?Math.sin(v.t*12)*0.55:0;
  m.legs.forEach((L,i)=>L.rotation.x=v.kind==='parrot'?(v.fy>0.1?0.9:sw*0.5*(i?1:-1)):sw*((i===0||i===3)?1:-1));
  if(P)return;
  if(m.segs){const N=m.segs.length,sp2=walking?5:1.2,amp=walking?0.13:0.05;m.segs.forEach((s,i)=>{s.position.x=Math.sin(v.t*sp2-i*0.6)*amp*(0.4+i/N)});m.head.position.x=Math.sin(v.t*sp2+0.6)*amp*0.4;const tg=m.head.userData.tg;if(tg)tg.visible=(v.t%2.2)<0.35}
  else if(v.kind==='pig'||v.kind==='hamster'||v.kind==='turtle'||v.kind==='cow'){if(m.tail)m.tail.rotation.z=Math.sin(v.t*(walking?12:4))*0.4;if(v.kind==='turtle')m.head.position.z=0.42+Math.sin(v.t*0.8)*0.04}
  else if(v.kind==='dog')m.tail.rotation.z=Math.sin(v.t*(walking||v.jump>0?16:9))*0.5;
  else if(v.kind==='cat'){m.tail.rotation.z=Math.sin(v.t*2)*0.35;m.head.rotation.y=walking?0:Math.sin(v.t*0.7)*0.4}
  else{const f=v.fy>0.1||v.jump>0?Math.sin(v.t*22)*0.9:0;m.wings[0].rotation.z=-Math.abs(f)-0.05;m.wings[1].rotation.z=Math.abs(f)+0.05;m.head.rotation.x=walking?0:Math.sin(v.t*3)*0.12}}
function petLine(p){const K=PET_KIND[p.kind]||{};if(!K.line)return '「'+(S.owner.name||'島主')+'好棒！'+(S.owner.name||'島主')+'好棒！」（'+p.name+'學會的第一句話）';return K.line.replace('{isle}',isleName(p.isle)).replace('{o}',S.owner.name||'島主')}
function petSound(p){const K=PET_KIND[p.kind]||{};if(!K.snd)return p.name+'：「'+(S.owner.name||'島主')+'好棒！」';return K.snd.replace('{n}',p.name)}
function selectPet(id){const v=petById[id];if(!v)return;flyTo(v.m.g.position.clone(),14);openSheet('pet',id)}
function patPet(id){const p=S.pets.find(x=>x.id===id),v=petById[id];if(!p)return;p.pats=(p.pats||0)+1;save();if(v){v.jump=1;v.wait=Math.max(v.wait,1.5);if(me)v.face=Math.atan2(meState.x-v.x,meState.z-v.z)}toast(petSound(p));render()}

/* =========================================================
   8. 島主（你自己）：點地面就走過去，會過橋

function hexN(c){try{return '#'+new THREE.Color(c).getHexString()}catch(e){return '#ffffff'}}

  h+='<button type="button" class="opt c pal" data-cpal="'+k+'" title="調色盤" aria-label="'+label+'：用調色盤自己調" aria-pressed="'+custom+'" style="--cur:'+v+'"></button></div>';
  h+='<div class="cpp" data-cpp="'+k+'" hidden><div class="cph"><i class="cpi" style="background:'+v+'"></i><code>'+v.toUpperCase()+'</code><button type="button" class="btn" data-cpclose="'+k+'">完成</button></div>'+
    [['h','色相',360],['s','鮮豔度',100],['l','亮度',100]].map(([c,l,m])=>'<label class="cps"><span>'+l+'</span><input type="range" min="0" max="'+m+'" step="1" data-hsl="'+k+'" data-ch="'+c+'" aria-label="'+label+' '+l+'"></label>').join('')+'</div></div>';
  return h}
const _hsl={h:0,s:0,l:0};
function cpGrad(p){const v={};p.querySelectorAll('[data-ch]').forEach(i=>v[i.dataset.ch]=+i.value);
  p.querySelectorAll('[data-ch]').forEach(i=>{const c=i.dataset.ch;i.style.background=c==='h'?'linear-gradient(90deg,'+[0,60,120,180,240,300,360].map(x=>'hsl('+x+','+v.s+'%,'+v.l+'%)').join(',')+')':
    c==='s'?'linear-gradient(90deg,hsl('+v.h+',0%,'+v.l+'%),hsl('+v.h+',100%,'+v.l+'%))':'linear-gradient(90deg,#000,hsl('+v.h+','+v.s+'%,50%),#fff)'});return v}

const clock=new THREE.Clock();let dayCheck=0;
function loop(){const dt=Math.min(0.05,clock.getDelta());
  simHour=S.ui.timeMode==='live'?localHour():S.ui.hour;applySky(simHour);document.getElementById('railClock').textContent=fmtHour(simHour);
  if(mode==='time'){const b=document.getElementById('tBig');if(b)b.textContent=fmtHour(simHour);const sl=document.getElementById('tSlider');if(sl&&document.activeElement!==sl)sl.value=simHour.toFixed(2)}
  dayCheck-=dt;if(dayCheck<=0){dayCheck=30;rollDay()}
  chars.forEach(v=>animChar(v,dt));pets.forEach(v=>animPet(v,dt));separate();tickHearts(dt);
  /* 島主 */
  if(me){meState.t+=dt;let wp=(meState.path&&meState.path.length)?meState.path[0]:null;
    if(wp&&meState.path.length>1&&Math.hypot(wp.x-meState.x,wp.z-meState.z)<0.15){meState.path.shift();wp=meState.path[0]}
    let walking=false;if(wp){const dx=wp.x-meState.x,dz=wp.z-meState.z,d=Math.hypot(dx,dz);walking=d>0.15;if(walking){const a=step2(meState,'x','z',wp.x,wp.z,3.2*dt,null);if(a!=null)meState.face=a;else if(meState._stuck){meState.path=null;walking=false}}else meState.path=null}
    if(!walking)meMark.material.opacity=Math.max(0,meMark.material.opacity-dt*1.5);
    me.g.position.set(meState.x,TOP+0.17+bridgeY(meState.x,meState.z)+(walking?Math.abs(Math.sin(meState.t*10))*0.08:0),meState.z);
    let dr=meState.face-me.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));me.g.rotation.y+=dr*Math.min(1,dt*10);
    const sw=walking?Math.sin(meState.t*10)*0.6:0;me.legL.rotation.x=sw;me.legR.rotation.x=-sw;me.armL.rotation.x=-sw*0.8;
    const wave=!walking&&(meState.t%7)<1.4;me.armR.rotation.x=walking?sw*0.8:0;me.armR.rotation.z=wave?2.5+Math.sin(meState.t*9)*0.35:0;
    marker.position.set(meState.x,me.g.position.y+0.33+2.55*me.g.scale.y+Math.sin(meState.t*3)*0.12,meState.z);marker.rotation.y+=dt*1.5}
  if(editOn()&&selItem&&itemObjs[selItem]){const o=itemObjs[selItem];selRing.position.set(o.position.x,o.position.y+0.05,o.position.z);selRing.scale.setScalar(selR/0.85*(1+Math.sin(meState.t*4)*0.04));selRing.visible=true}
  else{selRing.scale.setScalar(1);const sv=sel&&byId[sel]?byId[sel].c.g:selPet&&petById[selPet]?petById[selPet].m.g:null;if(sv){selRing.position.set(sv.position.x,TOP+0.2+bridgeY(sv.position.x,sv.position.z),sv.position.z);selRing.visible=true}else selRing.visible=false;}
  if(!S.ui.paused){const tt=clock.elapsedTime,tg=controls.target;for(const id in itemObjs){const o=itemObjs[id],an=o.userData.anims;if(an&&o.position.distanceToSquared(tg)<1800)for(const f of an)f(tt,dt)}}perfTick();
  if(!S.ui.paused){const a=bokehGeo.attributes.position;for(let i=0;i<NB;i++){let y=a.getY(i)+dt*0.25;if(y>11)y=2;a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(meState.t*0.5+i)*dt*0.08)}a.needsUpdate=true}
  followLock(dt);updateViewOffset(dt);
  if(tw){tw.t=Math.min(1,tw.t+dt/0.9);const e=1-Math.pow(1-tw.t,3);controls.target.lerpVectors(tw.ft,tw.tt,e);camera.position.lerpVectors(tw.fp,tw.tp,e);if(tw.t>=1)tw=null}
  controls.update();renderer.render(scene,camera);updateLabels();updateSelBox();pvTick(dt);
  requestAnimationFrame(loop)}

  if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:'periodic-background-sync'}).then(r=>{if(r.state==='granted')go()}).catch(go);else go()}).catch(()=>{})}

    el.hidden=false;['upOk','upX'].forEach(id=>document.getElementById(id).addEventListener('click',()=>el.hidden=true));setTimeout(()=>{if(!el.querySelector('details[open]'))el.hidden=true},20000)}

  if(/[?&]v=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash)}
document.getElementById('btnSetupImport').addEventListener('click',()=>{document.getElementById('setup').hidden=true;openSheet('import')});
/* App 版（PWA）：註冊離線用的 Service Worker（只在正式網站上） */
if('serviceWorker' in navigator&&(location.hostname==='kamaje122.github.io'||location.hostname==='localhost'))window.addEventListener('load',()=>{navigator.serviceWorker.register('myisland-sw.js',{scope:'./myisland'}).catch(()=>{})});
/* 啟動 */
if(S.islandName){startGame(false);rollDay();if(!S.guideDone)startGuide()}
else{buildWorld();buildMe();camera.position.set(9,12,30);controls.target.set(0,2,2);controls.update();showSetup()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>boards.forEach(paintBoard));
showUpdated();checkVersion();writeMeta();if(notifState()==='on')setPeriodic(true);maybeAskNotif();
requestAnimationFrame(()=>{loop();const ld=document.getElementById('loading');ld.style.opacity=0;setTimeout(()=>ld.remove(),700)});
})();
</script>
