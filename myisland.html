<!doctype html>
<!--
=====================================================================
  🏝️ 我的小島（朋友版範本）— 跟原版同一套 3D 玩具風
---------------------------------------------------------------------
  給 AI 的編輯說明（整份貼給 Claude 就能改）：
  - 3D 引擎：three.js r128 + OrbitControls（只從 cdnjs / jsdelivr 載入）
  - 所有資料存在 localStorage，key = "ai-dongzi-island-3d-v1"
      S = { islandName, owner:{name, look}, isles:[{id,slot,name,note,theme}],
            people:[{id,name,task,status,isle,look,quests:[{id,text,done}]}],
            xp, lastDay, guideDone, ui:{names,paused,bird,timeMode,hour} }
  - pets = [{id,kind(cat|dog|parrot=小鳥),name,isle,color,belly,pattern(COAT/BIRD_PAT),accent,collar,
             breed(mutt|shiba|chow),longHair,ears(prick|drop),pats}]（島嶼小動物）
  - items = [{id,type(ITEMS),x,z,y(高度),ry(方向弧度),s(大小),c:{顏色}}]（擺設模式放的家具）
  - 小島地板：isles[].floor / S.hubFloor（#hex，沒設定就用主題色）
  - look = { skin, hair, style(STYLES), kid, outfit(OUTFITS), shirt, pants, oc, oc2, capC, clipC,
             accs:[ACCS 的 key…], ac:{配件key:顏色} }（所有顏色都是 #hex，可用調色盤自由調）
  - 小島位置：SLOTS（中央主島 + 12 個六角形位置）；顏色主題：THEMES
  - 島民狀態：STATUS（進行中＝坐桌前打字、待辦＝舉手、穩定運作＝散步、暫停、閒置＝打瞌睡）
  - 換日時：已完成任務自動清掉，未完成的自動留到隔天
=====================================================================
-->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的小島</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --orange:#e8673a; --orange-deep:#c94f25; --ink:#2a2421; --ink-soft:#6b5f58; --paper:#fbf6ef; --panel:#fffdf9; --line:#eadfd3;
  --font-display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#bfe3ef;color:var(--ink);overflow:hidden}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.badge{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--c);display:grid;place-items:center;box-shadow:0 2px 6px #0002;pointer-events:auto;cursor:pointer;margin:-15px 0 0 -15px;position:relative}
.badge svg{width:15px;height:15px;stroke:var(--c);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.badge .q{position:absolute;top:-7px;right:-8px;width:17px;height:17px;border-radius:50%;background:#f2b705;color:#2a2421;font:900 11px/13px var(--font-display);text-align:center;border:2px solid #fff;box-sizing:border-box}
.badge .q.ok{background:#2f9e5f;color:#fff}
.tag{background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;padding:3px 11px 3px 6px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px #0003;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%)}
.tag i{width:16px;height:16px;border-radius:50%;background:var(--orange);display:inline-block;border:2px solid #fff}
.tag.me{background:#fff;color:var(--ink);padding-left:11px}
.tag.me b{color:var(--orange)}
.tag.sel{outline:2px solid var(--orange)}
.tag.pet{background:#e8a25a;font-size:12px;padding:2px 10px}
.tag.pet.sel{outline:2px solid #fff}
.zpill{background:#fffdf9;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;box-shadow:0 2px 8px #0002;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.zpill b{color:var(--orange);font-size:11px;margin-right:5px}
.zpill,.badge,.tag{transition:font-size .25s,padding .25s,transform .25s,opacity .25s}
#labels[data-zoom=far] .badge,#labels[data-zoom=far] .tag:not(.me){display:none}
#labels[data-zoom=far] .tag.me{transform:translate(-50%,-100%) scale(.62);transform-origin:50% 100%;opacity:.9}
#labels[data-zoom=far] .zpill{font-size:10px;padding:1px 7px;background:#fffdf9a8;box-shadow:none;font-weight:600}
#labels[data-zoom=mid] .tag:not(.me):not(.sel){display:none}
#labels[data-zoom=mid] .badge{transform:scale(.62);opacity:.92}
#labels[data-zoom=mid] .zpill{font-size:11px;padding:2px 9px;background:#fffdf9d0}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));background:var(--paper);border-radius:22px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px #0002;cursor:pointer;max-width:calc(100% - 110px);border:none;font:inherit;text-align:left;color:var(--ink)}
.brand .big{font-family:var(--font-display);font-weight:900;color:var(--orange);font-size:22px;line-height:1;letter-spacing:.02em;max-width:5.2em;word-break:break-all}
.brand .sub{font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.35;min-width:0}
.brand .sub span{color:var(--orange);font-size:11px;letter-spacing:.08em}
.brand .lv{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums}
.rail{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.rbtn{font:inherit;font-family:var(--font-display);font-weight:700;font-size:13px;background:#fffdf9ee;color:var(--ink);border:1px solid var(--line);border-radius:14px;width:62px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 2px 8px #0001;position:relative}
.rbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbtn.add{background:var(--orange);color:#fff;border-color:var(--orange-deep);box-shadow:0 3px 0 var(--orange-deep)}
.rbtn.add[aria-pressed=true]{background:var(--orange-deep)}
.rbtn.add.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--orange-deep),0 0 0 7px #e8673a44}}
@media (prefers-reduced-motion:reduce){.rbtn.add.pulse{animation:none}}
.rgap{height:4px}
.cnt{position:absolute;top:-6px;right:-6px;background:#f2b705;color:#2a2421;border-radius:999px;min-width:20px;height:20px;font-size:11px;line-height:16px;padding:0 4px;border:2px solid #fff;box-sizing:border-box;font-variant-numeric:tabular-nums}
.chips{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.chip{font:inherit;font-family:var(--font-display);font-weight:700;font-size:13px;background:#fffdf9ee;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbtn:focus-visible,.chip:focus-visible,.sheet button:focus-visible,.brand:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #0003;max-height:62%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:84%;max-height:84%}
.sheet-in{max-width:620px;width:100%;margin-inline:auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 8px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:18px;display:flex;align-items:center;gap:8px;min-width:0}
.x{font:inherit;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);flex:none}
.sheet-body{overflow:auto;padding:0 18px 18px;min-height:0;flex:1 1 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tab{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.meta{font-size:13px;color:var(--ink-soft)}
.go{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;padding:13px;border-radius:16px;background:var(--orange);color:#fff;border:none;width:100%;font-family:var(--font-display);font-weight:900;font-size:16px;cursor:pointer}
.go.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grp{margin:14px 0 6px;font-family:var(--font-display);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.row .nm{font-weight:700;font-size:14px}
.row .ds{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .ag{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.seen{font-size:11px;color:#b88a00;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.btn.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.red{color:#c2412d;border-color:#f1c4b8}
.btn.redfill{background:#d9473a;color:#fff;border-color:#d9473a}
.say{background:#fff3e2;border:1px solid #f1d9bb;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:15px;margin:10px 0;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);margin-top:10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:10px;background:#fff6f3;border:1px solid #f1c4b8;border-radius:12px;padding:10px}
.confirm span{flex:1 1 160px}
.li{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.li span{flex:1;min-width:0;word-break:break-word}
.li.done span{text-decoration:line-through;color:var(--ink-soft)}
.li input[type=checkbox]{width:20px;height:20px;accent-color:var(--orange);flex:none}
.li .who{font-size:11px;font-weight:700;color:var(--orange);flex:none}
.del{font:inherit;border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.addrow{display:flex;gap:6px;margin:4px 0 8px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.bar{height:10px;background:#f1e6da;border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--orange);transition:width .4s}
.fld{margin:0 0 12px}
.fld>label{display:block;font-weight:700;font-size:13px;margin-bottom:5px;font-family:var(--font-display)}
.fld input[type=text],.fld select,.fld textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;color:var(--ink)}
.fld textarea{min-height:62px;resize:vertical}
.hint{font-size:12px;color:var(--ink-soft);margin-top:4px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--orange)}
.theme{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:var(--ink)}
.theme i{width:22px;height:22px;border-radius:50%;display:inline-block}
.theme[aria-pressed=true]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.timebig{font-family:var(--font-display);font-weight:900;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
input[type=range]{width:100%;accent-color:var(--orange)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft)}
textarea.code{width:100%;height:150px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}

/* 長相編輯器 */
.editor{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.pv{width:150px;height:180px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#ffffff,#d7eef5);overflow:hidden;position:relative}
.pv canvas{display:block;width:100%!important;height:100%!important}
.pv small{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--ink-soft)}
.opt-row{margin-bottom:8px}
.opt-row .ol{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{font:inherit;font-size:12.5px;font-weight:700;min-width:30px;height:30px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:0 9px;cursor:pointer;color:var(--ink)}
.opt.c{width:30px;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.opt[aria-pressed=true]{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.opt.c[aria-pressed=true]{box-shadow:0 0 0 3px var(--orange)}
@media (max-width:520px){.editor{grid-template-columns:1fr}.pv{width:150px;height:170px;margin:0 auto}}

/* 調色盤 */
.opt.pal{position:relative;background:conic-gradient(#ff5a5a,#ffd84d,#6fdc6f,#4fd1e0,#5b7fe0,#c56fe0,#ff5a5a)!important}
.opt.pal::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cur,#fff);box-shadow:0 0 0 2px #fff}
.cpp{margin:8px 0 4px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px #0001}
.cph{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cpi{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
.cph code{font-size:12px;color:var(--ink-soft);flex:1}
.cps{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-soft);margin:9px 0}
.cps input{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:999px;margin:0;border:1px solid #0002;background:#ddd}
.cps input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px #0004;cursor:pointer}
.cps input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
/* 擺設模式 */
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea{-webkit-user-select:text;user-select:text}
@media (max-width:520px){.editor .pv{position:sticky;top:0;z-index:2;width:100%;height:150px;border-radius:0 0 20px 20px;box-shadow:0 6px 14px #0002}}
.sheet.short{max-height:52%}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:6px 0 4px}
.icard{font:inherit;font-size:12.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.25}
.icard span{font-size:26px;line-height:1}
.icard:active{transform:scale(.96)}
.mv{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,42px);grid-auto-rows:40px;gap:5px}
.pad .btn{padding:0;font-size:15px;display:flex;align-items:center;justify-content:center}
.srow{display:grid;grid-template-columns:62px 1fr 50px;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:4px 0}
.srow b{font-size:12px;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.srow input{width:100%;accent-color:var(--orange);margin:0}
.hq{margin:0 0 6px 70px}
.hq .tab{font-size:12px;padding:3px 10px}
@media (max-width:520px){.mv{grid-template-columns:1fr}.pad{justify-content:center}.hq{margin-left:0}}

/* 第一次登入 */
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:#bfe3ef66;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);overflow:auto}
.scard{background:var(--paper);border-radius:26px;box-shadow:0 12px 40px #0003;width:min(860px,100%);padding:22px;display:grid;grid-template-columns:1fr 1.15fr;gap:22px;max-height:100%;overflow:auto}
.scard h1{margin:0 0 2px;font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1.2}
.scard h1 em{font-style:normal;color:var(--orange)}
.scard .lead{font-size:14px;color:var(--ink-soft);margin:0 0 16px}
.scard .face{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.scard .face h3{margin:0 0 10px;font-family:var(--font-display);font-size:15px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 6px}
.chk input{width:18px;height:18px;accent-color:var(--orange)}
@media (max-width:760px){.scard{grid-template-columns:1fr;padding:18px;gap:14px}.scard h1{font-size:22px}}

.guide{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translateX(-50%);width:min(92%,420px);background:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 8px 28px #0003;display:flex;gap:12px}
.guide .ava{width:44px;height:44px;border-radius:50%;background:var(--orange);flex:none;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:900}
.guide p{margin:0 0 8px;font-size:14px}
.guide .gbtn{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.guide .gbtn small{margin-right:auto;color:var(--ink-soft);font-size:12px}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:#2a2421;color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;box-shadow:0 4px 14px #0003;pointer-events:none;max-width:86%;text-align:center;z-index:9}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#bfe3ef;font-family:var(--font-display);font-weight:700;color:var(--ink);transition:opacity .6s;z-index:10}
</style></head><body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="hud" hidden>
    <button class="brand" id="brand" type="button" aria-label="島嶼設定">
      <div class="big" id="brandBig">我的<br>小島</div>

  h+='<div class="cpp" data-cpp="'+k+'" hidden><div class="cph"><i class="cpi" style="background:'+v+'"></i><code>'+v.toUpperCase()+'</code><button type="button" class="btn" data-cpclose="'+k+'">完成</button></div>'+

function cpGrad(p){const v={};p.querySelectorAll('[data-ch]').forEach(i=>v[i.dataset.ch]=+i.value);

      const q=Math.PI/2;S.items.push({id:uid(),type:'sofa',x:-8.7,z:0.5,y:0,ry:q,s:1,c:{}},{id:uid(),type:'ctable',x:-7.1,z:0.5,y:0,ry:q,s:1,c:{}},{id:uid(),type:'vase',x:-7.1,z:0.2,y:0.45,ry:0,s:1,c:{}});
      S.people.push({id:uid(),name:'記帳秘書',task:'每天提醒我把花費記下來',status:'穩定運作',isle:a.id,look:randomLook(),quests:[{id:uid(),text:'記下今天的午餐花費',done:false}]});
      S.people.push({id:uid(),name:'排班秘書',task:'把這個月的班表排進行事曆',status:'待辦',isle:a.id,look:randomLook(),quests:[{id:uid(),text:'拍下這個月的班表',done:false}]});
      S.people.push({id:uid(),name:'英文家教',task:'每天陪我背 10 個單字',status:'進行中',isle:b.id,look:randomLook(),quests:[{id:uid(),text:'背 10 個英文單字',done:false},{id:uid(),text:'聽一集英文 Podcast',done:false}]})}
    save();el.hidden=true;PV.el=null;startGame(true)})}

function startGame(first){document.getElementById('hud').hidden=false;buildWorld();buildMe();updateHud();applyToggles();
  meState.x=-1.6;meState.z=5.2;setView(S.ui.bird,!first);if(first){setTimeout(startGuide,900);toast('🎉 '+S.islandName+' 誕生了！')}}

/* =========================================================
   19. 動畫迴圈
   ========================================================= */
function resize(){W=stage.clientWidth;H=stage.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let dayCheck=0;
function loop(){const dt=Math.min(0.05,clock.getDelta());
  simHour=S.ui.timeMode==='live'?localHour():S.ui.hour;applySky(simHour);document.getElementById('railClock').textContent=fmtHour(simHour);
  if(mode==='time'){const b=document.getElementById('tBig');if(b)b.textContent=fmtHour(simHour);const sl=document.getElementById('tSlider');if(sl&&document.activeElement!==sl)sl.value=simHour.toFixed(2)}
  dayCheck-=dt;if(dayCheck<=0){dayCheck=30;rollDay()}
  chars.forEach(v=>animChar(v,dt));pets.forEach(v=>animPet(v,dt));
  /* 島主 */
  if(me){meState.t+=dt;let wp=(meState.path&&meState.path.length)?meState.path[0]:null;
    if(wp&&meState.path.length>1&&Math.hypot(wp.x-meState.x,wp.z-meState.z)<0.15){meState.path.shift();wp=meState.path[0]}
    let walking=false;if(wp){const dx=wp.x-meState.x,dz=wp.z-meState.z,d=Math.hypot(dx,dz);walking=d>0.15;if(walking){const s=Math.min(d,3.2*dt);meState.x+=dx/d*s;meState.z+=dz/d*s;meState.face=Math.atan2(dx,dz)}else meState.path=null}
    if(!walking)meMark.material.opacity=Math.max(0,meMark.material.opacity-dt*1.5);
    me.g.position.set(meState.x,TOP+0.17+bridgeY(meState.x,meState.z)+(walking?Math.abs(Math.sin(meState.t*10))*0.08:0),meState.z);
    let dr=meState.face-me.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));me.g.rotation.y+=dr*Math.min(1,dt*10);
    const sw=walking?Math.sin(meState.t*10)*0.6:0;me.legL.rotation.x=sw;me.legR.rotation.x=-sw;me.armL.rotation.x=-sw*0.8;
    const wave=!walking&&(meState.t%7)<1.4;me.armR.rotation.x=walking?sw*0.8:0;me.armR.rotation.z=wave?2.5+Math.sin(meState.t*9)*0.35:0;
    marker.position.set(meState.x,me.g.position.y+2.88+Math.sin(meState.t*3)*0.12,meState.z);marker.rotation.y+=dt*1.5}
  if(editOn()&&selItem&&itemObjs[selItem]){const o=itemObjs[selItem];selRing.position.set(o.position.x,o.position.y+0.05,o.position.z);selRing.scale.setScalar(selR/0.85*(1+Math.sin(meState.t*4)*0.04));selRing.visible=true}
  else{selRing.scale.setScalar(1);const sv=sel&&byId[sel]?byId[sel].c.g:selPet&&petById[selPet]?petById[selPet].m.g:null;if(sv){selRing.position.set(sv.position.x,TOP+0.2+bridgeY(sv.position.x,sv.position.z),sv.position.z);selRing.visible=true}else selRing.visible=false;}
  if(!S.ui.paused){const tt=clock.elapsedTime;for(const id in itemObjs){const an=itemObjs[id].userData.anims;if(an)for(const f of an)f(tt,dt)}}
  if(!S.ui.paused){const a=bokehGeo.attributes.position;for(let i=0;i<NB;i++){let y=a.getY(i)+dt*0.25;if(y>11)y=2;a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(meState.t*0.5+i)*dt*0.08)}a.needsUpdate=true}
  if(tw){tw.t=Math.min(1,tw.t+dt/0.9);const e=1-Math.pow(1-tw.t,3);controls.target.lerpVectors(tw.ft,tw.tt,e);camera.position.lerpVectors(tw.fp,tw.tp,e);if(tw.t>=1)tw=null}
  controls.update();renderer.render(scene,camera);updateLabels();pvTick(dt);
  requestAnimationFrame(loop)}

/* 啟動 */
if(S.islandName){startGame(false);rollDay();if(!S.guideDone)startGuide()}
else{buildWorld();buildMe();camera.position.set(9,12,30);controls.target.set(0,2,2);controls.update();showSetup()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>boards.forEach(paintBoard));
requestAnimationFrame(()=>{loop();const ld=document.getElementById('loading');ld.style.opacity=0;setTimeout(()=>ld.remove(),700)});
})();
</script>
