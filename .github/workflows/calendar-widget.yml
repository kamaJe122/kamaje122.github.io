name: Build calendar widget APK

on:
  push:
    paths:
      - "pixel-calendar-widget/**"
      - ".github/workflows/calendar-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: pixel-calendar-widget
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/calendar-widget.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: calendar-widget-apk
          path: calendar-widget.apk

      # 合併進 main 之後，把 APK 放到固定的 Release，手機瀏覽器可以直接下載安裝
      - name: Publish APK to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete calendar-widget-latest --yes --cleanup-tag || true
          gh release create calendar-widget-latest calendar-widget.apk \
            --target "$GITHUB_SHA" \
            --title "KM 桌面行事曆小工具 APK（最新版）" \
            --notes "Pixel 桌面 5×2 月曆＋行程小工具。下載 calendar-widget.apk 後直接安裝。"
